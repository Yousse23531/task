name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor (generates App.xcworkspace)
        run: npx cap sync ios

      - name: Show ios/App contents (debug)
        run: ls -la ios/App/

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios/App
          # Use whichever workspace exists after cap sync
          if [ -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Found App.xcworkspace"
            xcodebuild -resolvePackageDependencies \
              -workspace App.xcworkspace \
              -scheme App \
              -clonedSourcePackagesDirPath SourcePackages
          else
            echo "App.xcworkspace not found, using xcodeproj"
            xcodebuild -resolvePackageDependencies \
              -project App.xcodeproj \
              -scheme App \
              -clonedSourcePackagesDirPath SourcePackages
          fi

      - name: Build iOS App (Archive)
        run: |
          cd ios/App
          if [ -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            WORKSPACE_ARG="-workspace App.xcworkspace"
          else
            WORKSPACE_ARG="-project App.xcodeproj"
          fi
          xcodebuild \
            $WORKSPACE_ARG \
            -scheme App \
            -destination generic/platform=iOS \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_VERSION=5 \
            OTHER_SWIFT_FLAGS="-strict-concurrency=minimal"

      - name: Package IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r TaskAndEventManager-iOS.ipa Payload/

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: ios/App/build/TaskAndEventManager-iOS.ipa
