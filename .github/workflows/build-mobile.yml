name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Android SDK 35 & 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" 2>/dev/null || true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor (generates App.xcworkspace)
        run: npx cap sync ios

      - name: Patch plugin Package.swift to Swift 5.9
        run: |
          for pkg in \
            node_modules/@capacitor/keyboard/ios \
            node_modules/@capacitor/splash-screen/ios \
            node_modules/@capacitor/status-bar/ios; do
            if [ -f "$pkg/Package.swift" ]; then
              echo "=== Before patch: $pkg/Package.swift ==="
              head -3 "$pkg/Package.swift"
              sed -i '' 's/swift-tools-version:[[:space:]]*[0-9][0-9.]*/swift-tools-version: 5.9/' "$pkg/Package.swift"
              # Remove swiftLanguageVersions line(s) that pin to Swift 6
              sed -i '' '/swiftLanguageVersions/d' "$pkg/Package.swift"
              echo "=== After patch ==="
              head -3 "$pkg/Package.swift"
            fi
          done

      - name: Detect workspace or project
        id: detect
        run: |
          if [ -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "BUILD_ARG=-workspace App.xcworkspace" >> $GITHUB_OUTPUT
            echo "Found xcworkspace"
          else
            echo "BUILD_ARG=-project App.xcodeproj" >> $GITHUB_OUTPUT
            echo "Falling back to xcodeproj"
          fi
          ls -la ios/App/

      - name: Resolve Swift Packages
        run: |
          cd ios/App
          xcodebuild ${{ steps.detect.outputs.BUILD_ARG }} \
            -scheme App \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath SourcePackages 2>&1 | tail -20

      - name: Build iOS App (no signing)
        run: |
          cd ios/App
          set -o pipefail
          xcodebuild \
            ${{ steps.detect.outputs.BUILD_ARG }} \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            archive \
            SWIFT_VERSION=5 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-strict-concurrency=minimal" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/xcode_build.log | grep -E "^.*(error:|BUILD (FAILED|SUCCEEDED)|ARCHIVE (FAILED|SUCCEEDED)).*$" | tail -60 || \
          (echo "=== FULL ERRORS ===" && grep "error:" /tmp/xcode_build.log | head -30 && exit 1)

      - name: Package IPA
        run: |
          cd ios/App
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            mkdir -p build/Payload
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
            cd build
            zip -r TaskAndEventManager-iOS.ipa Payload/
            echo "IPA created successfully"
          else
            echo "Archive contents:"
            find build/App.xcarchive -name "*.app" 2>/dev/null || echo "No .app found"
            exit 1
          fi

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: ios/App/build/TaskAndEventManager-iOS.ipa
